<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBD FIRAA</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: 'Poppins', sans-serif;
      background: radial-gradient(circle at top, #2a4a7c, #0d1b3e 70%, #7ab8e0);
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      text-align: center;
      overflow: hidden;
      position: relative;
    }

    /* Canvas untuk fireworks */
    #fireworks-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
      pointer-events: none;
    }

    /* Overlay untuk animasi kado */
    #gift-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(13, 27, 62, 0.95);
      backdrop-filter: blur(10px);
      z-index: 9999;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.5s ease, visibility 0.3s ease;
    }

    #gift-overlay.active {
      opacity: 1;
      visibility: visible;
    }

    .gift-container {
      position: relative;
      width: 100%;
      height: 100%;
      display: flex;
      justify-content: center;
      align-items: center;
      perspective: 1000px;
    }

    /* Animasi kado */
    .giant-gift {
      position: relative;
      width: min(70vw, 70vh);
      height: min(70vw, 70vh);
      transform-style: preserve-3d;
      cursor: pointer;
      transition: opacity 0.6s ease, transform 0.6s ease;
    }

    .giant-gift.fade-out {
      opacity: 0;
      transform: scale(0.8);
    }

    .gift-box {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, #4a8bbf, #2a6a9f);
      border-radius: 30px;
      box-shadow: 0 0 100px rgba(74, 139, 191, 0.6);
      transform: translateZ(50px);
      border: 5px solid rgba(255, 255, 255, 0.2);
      overflow: hidden;
    }

    .gift-lid {
      position: absolute;
      width: 105%;
      height: 30%;
      background: linear-gradient(135deg, #6aabdf, #4a8bbf);
      top: -15%;
      left: -2.5%;
      border-radius: 30px 30px 10px 10px;
      box-shadow: 0 20px 30px rgba(0, 0, 0, 0.3);
      transform: rotateX(0deg);
      transform-origin: bottom center;
      transition: transform 2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 5px solid rgba(255, 255, 255, 0.2);
    }

    .gift-ribbon {
      position: absolute;
      background: linear-gradient(135deg, #b0d4f4, #8ab8e0);
      box-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
    }

    .gift-ribbon.vertical {
      width: 15%;
      height: 100%;
      left: 42.5%;
      top: 0;
      border-radius: 20px;
    }

    .gift-ribbon.horizontal {
      width: 100%;
      height: 15%;
      top: 42.5%;
      left: 0;
      border-radius: 20px;
    }

    .gift-bow {
      position: absolute;
      width: 40%;
      height: 40%;
      top: -10%;
      left: 30%;
      transform: rotate(-10deg);
    }

    .bow-part {
      position: absolute;
      width: 50%;
      height: 50%;
      background: linear-gradient(135deg, #6aabdf, #4a8bbf);
      border-radius: 50% 50% 0 50%;
      box-shadow: 0 10px 20px rgba(0, 0, 0, 0.2);
      border: 3px solid rgba(255, 255, 255, 0.2);
    }

    .bow-part.left {
      left: 0;
      transform: rotate(-35deg);
    }

    .bow-part.right {
      right: 0;
      transform: rotate(55deg);
    }

    .bow-center {
      position: absolute;
      width: 30%;
      height: 30%;
      background: #4a8bbf;
      border-radius: 50%;
      top: 30%;
      left: 35%;
      box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
      border: 3px solid rgba(255, 255, 255, 0.3);
    }

    .giant-gift.opening .gift-lid {
      transform: rotateX(120deg) translateY(-40%) translateZ(100px);
    }

    .gift-content {
      position: absolute;
      width: 80%;
      height: 80%;
      top: 10%;
      left: 10%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: white;
      text-shadow: 0 0 30px rgba(255, 255, 255, 0.3);
      opacity: 0;
      transform: scale(0.5);
      transition: all 0.4s ease 0.2s;
      pointer-events: none;
    }

    .giant-gift.opening .gift-content {
      opacity: 1;
      transform: scale(1);
    }

    .gift-content h1 {
      font-size: clamp(2rem, 8vw, 3.5rem);
      margin-bottom: 10px;
      color: white;
      text-shadow: 0 0 30px #4a8bbf;
    }

    /* Spinner Loading Baru */
    .loading-wrapper {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.6s ease;
    }

    .loading-wrapper.active {
      opacity: 1;
      visibility: visible;
    }

    .spinner {
      width: 70px;
      height: 70px;
      border: 6px solid rgba(176, 212, 244, 0.2);
      border-top: 6px solid #b0d4f4;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      box-shadow: 0 0 20px rgba(74, 139, 191, 0.5);
      margin-bottom: 20px;
    }

    .loading-wrapper p {
      font-size: 1.3rem;
      font-weight: 500;
      color: #e0f0ff;
      text-shadow: 0 0 10px rgba(74, 139, 191, 0.8);
      letter-spacing: 1px;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .wrap {
      padding: 20px;
      max-width: 600px;
      width: 100%;
      position: relative;
      z-index: 10;
    }

    h1 {
      font-size: 2.8rem;
      margin-bottom: 0.2em;
      text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5), 0 0 20px rgba(255, 255, 255, 0.3);
      animation: fadeInUp 1s ease-out;
      color: white;
      font-weight: 700;
    }

    h2 {
      font-weight: 300;
      color: rgba(255, 255, 255, 0.9);
      margin-top: 0;
      margin-bottom: 30px;
      font-size: 1.2rem;
      letter-spacing: 2px;
      animation: fadeIn 2s ease 3.5s forwards;
      opacity: 0;
      text-shadow: 1px 1px 3px rgba(0, 0, 0, 0.4);
    }

    /* Indikator microphone */
    .mic-status {
      background: rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px);
      padding: 12px 25px;
      border-radius: 50px;
      display: none; 
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin: 0 auto 25px auto;
      max-width: 300px;
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
      animation: slideDown 0.5s ease;
      z-index: 20;
      position: relative;
    }

    .mic-status.active {
      display: flex;
    }

    .mic-icon {
      font-size: 1.5rem;
      animation: pulse 1.5s infinite;
    }

    .mic-text {
      font-size: 1rem;
      font-weight: 500;
      color: white;
      text-shadow: 1px 1px 2px black;
    }

    .volume-bar-container {
      width: 80px;
      height: 8px;
      background: rgba(0, 0, 0, 0.3);
      border-radius: 10px;
      overflow: hidden;
    }

    .volume-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #4a8bbf, #7ab8e0);
      border-radius: 10px;
      transition: width 0.05s ease;
    }

    /* Kontainer kue */
    .cake-build {
      position: relative;
      width: 260px;
      height: 280px;
      margin: 0 auto 20px;
      z-index: 15;
    }

    .cake-build>* {
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    .layer {
      border-radius: 30px 30px 15px 15px;
      transform: translateX(-50%) scaleX(0);
      animation: grow 0.7s forwards;
      box-shadow: 0 8px 0 rgba(0, 0, 0, 0.15);
    }

    .layer1 { bottom: 0; width: 220px; height: 70px; background: #4a8bbf; animation-delay: 0.2s; z-index: 1; }
    .layer2 { bottom: 60px; width: 190px; height: 65px; background: #3a7aaf; animation-delay: 0.9s; z-index: 2; }
    .layer3 { bottom: 115px; width: 160px; height: 60px; background: #2a6a9f; animation-delay: 1.6s; z-index: 3; }

    .icing {
      bottom: 165px;
      width: 170px;
      height: 25px;
      background: #b0d4f4;
      border-radius: 40px 40px 20px 20px;
      transform: translateX(-50%) scaleX(0);
      animation: grow 0.6s forwards 2.2s;
      box-shadow: 0 5px 0 #8ab8e0;
      z-index: 4;
    }

    .drip-container {
      bottom: 165px;
      width: 170px;
      height: 30px;
      z-index: 5;
      opacity: 0;
      animation: fadeIn 0.8s forwards 2.6s;
    }

    .drip {
      position: absolute;
      width: 20px;
      height: 25px;
      background: #b0d4f4;
      border-radius: 50%;
      bottom: -10px;
      box-shadow: 0 5px 0 #8ab8e0;
    }

    .drip1 { left: 20px; }
    .drip2 { left: 70px; }
    .drip3 { left: 120px; }

    /* LILIN */
    .candle {
      bottom: 180px;
      width: 16px;
      height: 65px;
      background: linear-gradient(145deg, #e0f0ff, #b0d0f0);
      border-radius: 8px 8px 4px 4px;
      opacity: 0;
      animation: fadeIn 0.5s forwards 2.9s;
      box-shadow: 0 6px 0 #8aaac0, 0 0 20px rgba(255, 255, 255, 0.2);
      z-index: 6;
      border: 1px solid rgba(255, 255, 255, 0.2);
    }

    .wick {
      position: absolute;
      top: -5px;
      left: 6px;
      width: 4px;
      height: 10px;
      background: #6b4f3c;
      border-radius: 2px;
    }

    .flame {
      position: absolute;
      top: -25px;
      left: 3px;
      width: 10px;
      height: 22px;
      background: radial-gradient(circle at 30% 30%, #b3e5fc, #0288d1);
      border-radius: 50% 50% 30% 30%;
      transform-origin: bottom center;
      animation: flicker 0.15s infinite alternate;
      box-shadow: 0 0 20px #0288d1;
    }

    .candle.extinguished .flame {
      opacity: 0;
      animation: none;
      box-shadow: none;
    }

    .sprinkles {
      bottom: 180px;
      width: 150px;
      height: 20px;
      z-index: 7;
      opacity: 0;
      animation: fadeIn 0.8s forwards 3.3s;
    }

    .sprinkle {
      position: absolute;
      width: 6px;
      height: 6px;
      background: #7ab8e0;
      border-radius: 2px;
      transform: rotate(45deg);
      box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.3);
    }

    .sprinkle:nth-child(1) { left: 20px; top: 0; background: #4a8bbf; }
    .sprinkle:nth-child(2) { left: 50px; top: 8px; background: #6aabdf; }
    .sprinkle:nth-child(3) { left: 80px; top: 3px; background: #b0d4f4; }
    .sprinkle:nth-child(4) { left: 110px; top: 12px; background: #2a6a9f; }
    .sprinkle:nth-child(5) { left: 130px; top: 4px; background: #8ab8e0; }

    .glow-effect {
      position: absolute;
      width: 300px;
      height: 300px;
      background: radial-gradient(circle, rgba(74, 139, 191, 0.3) 0%, transparent 70%);
      top: -10px;
      left: -20px;
      z-index: 0;
      animation: pulse 3s infinite alternate;
    }

    /* Style untuk tombol-tombol */
    button {
      padding: 16px 30px;
      border: none;
      border-radius: 50px;
      background: linear-gradient(135deg, #4a8bbf, #7ab8e0);
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 15px 30px rgba(74, 139, 191, 0.4);
      transition: transform 0.3s, box-shadow 0.3s;
      border: 2px solid rgba(255, 255, 255, 0.2);
    }

    button:hover {
      transform: translateY(-5px) scale(1.02);
      box-shadow: 0 20px 40px rgba(74, 139, 191, 0.6);
    }

    .start-btn {
      margin-bottom: 20px;
      background: linear-gradient(135deg, #f6d365, #fda085);
      color: white;
      text-shadow: 1px 1px 2px rgba(0, 0, 0, 0.2);
      box-shadow: 0 10px 25px rgba(253, 160, 133, 0.4);
      animation: pulse 2s infinite alternate;
      z-index: 20;
      position: relative;
    }

    .start-btn:hover {
      background: linear-gradient(135deg, #fda085, #f6d365);
    }

    .action-area {
      position: relative;
      height: 80px;
      margin-top: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 20;
    }

    .wish-text {
      position: absolute;
      font-family: 'Playfair Display', serif;
      font-size: 1.6rem;
      font-style: italic;
      color: #e0f0ff;
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 2px 2px 4px rgba(0,0,0,0.4);
      opacity: 0;
      visibility: hidden;
      transform: translateY(20px);
      transition: all 0.8s ease;
      width: 100%;
    }

    .wish-text.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .wish-text.hide {
      opacity: 0;
      visibility: hidden;
      transform: translateY(-20px);
    }

    .button-group {
      position: absolute;
      display: flex;
      gap: 15px;
      justify-content: center;
      width: 100%;
      opacity: 0;
      visibility: hidden;
      transform: translateY(30px);
      transition: all 0.8s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .button-group.show {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
    }

    .reset-btn {
      padding: 16px 25px;
      background: linear-gradient(135deg, #1a2a6c, #3a7aaf);
      color: white;
    }

    @keyframes grow {
      0% { transform: translateX(-50%) scaleX(0); }
      70% { transform: translateX(-50%) scaleX(1.05); }
      100% { transform: translateX(-50%) scaleX(1); }
    }

    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }

    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    @keyframes flicker {
      0% { transform: scale(1) rotate(-3deg); opacity: 0.9; }
      100% { transform: scale(1.2) rotate(4deg); opacity: 1; }
    }

    @keyframes pulse {
      0% { opacity: 0.8; transform: scale(0.95); }
      100% { opacity: 1; transform: scale(1.05); }
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .stars {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 0;
    }

    .star {
      position: absolute;
      color: rgba(255, 255, 255, 0.8);
      font-size: 1.5rem;
      animation: twinkle 2s infinite alternate;
    }

    @keyframes twinkle {
      0% { opacity: 0.2; transform: scale(0.8); }
      100% { opacity: 1; transform: scale(1.2); }
    }
  </style>
</head>

<body>
  <!-- Canvas untuk Fireworks -->
  <canvas id="fireworks-canvas"></canvas>

  <!-- Gift Overlay -->
  <div id="gift-overlay">
    <div class="gift-container">
      <!-- Kotak Kado -->
      <div class="giant-gift" id="giantGift">
        <div class="gift-box">
          <div class="gift-lid"></div>
          <div class="gift-ribbon vertical"></div>
          <div class="gift-ribbon horizontal"></div>
          <div class="gift-bow">
            <div class="bow-part left"></div>
            <div class="bow-part right"></div>
            <div class="bow-center"></div>
          </div>
        </div>
        <div class="gift-content">
          
        </div>
      </div>

      <!-- Spinner Loading Baru -->
      <div class="loading-wrapper" id="loadingWrapper">
        <div class="spinner"></div>
        <p>Kado nya lagi di bikin...</p>
      </div>
    </div>
  </div>

  <div class="stars">
    <span class="star" style="top:10%; left:5%;">⭐</span>
    <span class="star" style="top:20%; right:10%;">✨</span>
    <span class="star" style="bottom:15%; left:15%;">🌟</span>
    <span class="star" style="bottom:5%; right:20%;">💫</span>
  </div>

  <div class="wrap">
    <h1>Happy Birthday raaa 🥳</h1>
    <h2>A little surprise just for you.</h2>

    <!-- Tombol Pemicu Mic -->
    <button id="startMicBtn" class="start-btn">🌬️ Mulai Tiup Lilin</button>

    <!-- Status microphone -->
    <div class="mic-status" id="micStatus">
      <span class="mic-icon" id="micIcon">🎤</span>
      <span class="mic-text" id="micText">Klik "Izinkan" untuk meniup lilin</span>
      <div class="volume-bar-container">
        <div class="volume-bar" id="volumeBar"></div>
      </div>
    </div>

    <div class="cake-build">
      <div class="layer layer1"></div>
      <div class="layer layer2"></div>
      <div class="layer layer3"></div>
      <div class="icing"></div>

      <div class="drip-container">
        <div class="drip drip1"></div>
        <div class="drip drip2"></div>
        <div class="drip drip3"></div>
      </div>

      <!-- LILIN -->
      <div class="candle" id="candle">
        <div class="wick"></div>
        <div class="flame" id="flame"></div>
      </div>

      <div class="sprinkles">
        <div class="sprinkle"></div>
        <div class="sprinkle"></div>
        <div class="sprinkle"></div>
        <div class="sprinkle"></div>
        <div class="sprinkle"></div>
      </div>

      <div class="glow-effect"></div>
    </div>

    <!-- Area Aksi -->
    <div class="action-area">
      <div id="wishText" class="wish-text">"I hope all your wishes come true." ✨</div>
      
      <div class="button-group" id="actionButtons">
        <button id="openGiftBtn">Hadiah Kecil Buat Kamuu 🎁</button>
        <button class="reset-btn" onclick="resetCandle()">🕯️ Nyalakan Lagi</button>
      </div>
    </div>

  </div>

  <script>
    // ========== FIREWORKS ==========
    const canvas = document.getElementById('fireworks-canvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    resizeCanvas();
    window.addEventListener('resize', resizeCanvas);

    class HeartFirework {
      constructor(x, y) {
        this.x = x;
        this.y = y;
        this.particles = [];
        this.createHeart();
      }

      createHeart() {
        for (let t = 0; t < Math.PI * 2; t += 0.1) {
          const scale = 15;
          const heartX = 16 * Math.pow(Math.sin(t), 3);
          const heartY = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);

          for (let i = 0; i < 3; i++) {
            const offsetX = (Math.random() - 0.5) * 10;
            const offsetY = (Math.random() - 0.5) * 10;

            this.particles.push({
              x: this.x + heartX * scale + offsetX,
              y: this.y - heartY * scale + offsetY,
              vx: (Math.random() - 0.5) * 2,
              vy: (Math.random() - 0.5) * 2 - 1,
              life: 1.0,
              color: `hsl(${210 + Math.random() * 30}, 100%, 70%)`
            });
          }
        }
      }

      update() {
        for (let i = this.particles.length - 1; i >= 0; i--) {
          const p = this.particles[i];
          p.x += p.vx;
          p.y += p.vy;
          p.vy += 0.1;
          p.life -= 0.005;

          if (p.life <= 0) {
            this.particles.splice(i, 1);
          }
        }
      }

      draw() {
        for (const p of this.particles) {
          ctx.beginPath();
          ctx.arc(p.x, p.y, 3 * p.life, 0, Math.PI * 2);
          ctx.fillStyle = p.color.replace('70%', `${p.life * 100}%`);
          ctx.shadowColor = '#4a8bbf';
          ctx.shadowBlur = 20 * p.life;
          ctx.fill();
        }
      }

      isAlive() {
        return this.particles.length > 0;
      }
    }

    const fireworks = [];

    setInterval(() => {
      const x = Math.random() * canvas.width;
      const y = Math.random() * canvas.height * 0.5;
      fireworks.push(new HeartFirework(x, y));
    }, 3000);

    function animate() {
      ctx.fillStyle = 'rgba(13, 27, 62, 0.1)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      for (let i = fireworks.length - 1; i >= 0; i--) {
        const f = fireworks[i];
        f.update();
        f.draw();
        if (!f.isAlive()) {
          fireworks.splice(i, 1);
        }
      }

      requestAnimationFrame(animate);
    }

    animate();

    // ========== MICROPHONE & CANDLE ==========
    let audioContext = null;
    let analyser = null;
    let microphone = null;
    let isBlowing = false;
    let blowCount = 0;
    const BLOW_THRESHOLD = 1;
    let candleLit = true;

    const candle = document.getElementById('candle');
    const micIcon = document.getElementById('micIcon');
    const micText = document.getElementById('micText');
    const volumeBar = document.getElementById('volumeBar');
    const actionButtons = document.getElementById('actionButtons');
    const startMicBtn = document.getElementById('startMicBtn');
    const micStatus = document.getElementById('micStatus');
    const wishText = document.getElementById('wishText');

    startMicBtn.addEventListener('click', () => {
      startMicBtn.style.display = 'none'; 
      micStatus.classList.add('active'); 
      initMicrophone();
    });

    async function initMicrophone() {
      try {
        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });

        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphone = audioContext.createMediaStreamSource(stream);

        microphone.connect(analyser);
        analyser.fftSize = 256;

        const bufferLength = analyser.frequencyBinCount;
        const dataArray = new Uint8Array(bufferLength);

        micIcon.textContent = '🎤✅';
        micText.textContent = 'tiup lilin nyaa!';

        function detectBlow() {
          if (!analyser) return;

          analyser.getByteFrequencyData(dataArray);

          let sum = 0;
          for (let i = 0; i < bufferLength; i++) {
            sum += dataArray[i];
          }
          let average = sum / bufferLength;

          let volume = Math.min(100, (average / 128) * 100);
          volumeBar.style.width = volume + '%';

          if (volume > 50 && candleLit) {
            if (!isBlowing) {
              isBlowing = true;
              blowCount++;

              if (blowCount >= BLOW_THRESHOLD) {
                candleLit = false;
                candle.classList.add('extinguished');
                micText.textContent = 'YEYYYY 🎉';
                micIcon.textContent = '🎤🎂';
                
                wishText.classList.remove('hide');
                wishText.classList.add('show');

                setTimeout(() => {
                  wishText.classList.remove('show');
                  wishText.classList.add('hide');
                  
                  setTimeout(() => {
                    actionButtons.classList.add('show');
                    micText.textContent = 'Buka kadoo nyaa doong 🎉';
                  }, 800);

                }, 5000);

              } else {
                micText.textContent = `Tiupan ${blowCount}/${BLOW_THRESHOLD}`;
              }
            }
          } else if (volume <= 30) {
            isBlowing = false;
          }

          requestAnimationFrame(detectBlow);
        }

        if (audioContext.state === 'suspended') {
          audioContext.resume();
        }

        detectBlow();

      } catch (err) {
        micIcon.textContent = '🎤❌';
        micText.textContent = 'izinkan akses microphone yaa ^_^';
      }
    }

    window.resetCandle = function () {
      candleLit = true;
      blowCount = 0;
      candle.classList.remove('extinguished');
      micText.textContent = 'Tiupp lilin nyaa yaa';
      micIcon.textContent = '🎤✅';
      volumeBar.style.width = '0%';
      
      actionButtons.classList.remove('show');
      wishText.classList.remove('hide', 'show');
    };

    // ========== GIFT OPENING & SPINNER LOADING TRANSITION ==========
    const giftOverlay = document.getElementById('gift-overlay');
    const giantGift = document.getElementById('giantGift');
    const openGiftBtn = document.getElementById('openGiftBtn');
    const loadingWrapper = document.getElementById('loadingWrapper');

    openGiftBtn.addEventListener('click', function () {
      giftOverlay.classList.add('active');

      setTimeout(() => {
        // 1. Animasi tutup kado terbuka & teks surprise muncul
        giantGift.classList.add('opening');
        
        // 2. Setelah 2 detik (pas kado kebuka), kado di-fade out (hilang)
        setTimeout(() => {
          giantGift.classList.add('fade-out');

          // 3. Munculin animasi loading muter-muter beserta teksnya
          setTimeout(() => {
            giantGift.style.display = 'none'; // Sembunyikan elemen kado
            loadingWrapper.classList.add('active');

            // 4. Delay 8 detik sebelum pindah ke halaman foto.html
            setTimeout(() => {
              window.location.href = 'foto.html';
            }, 4000);

          }, 500);

        }, 2000);

      }, 400); 
    });
  </script>
